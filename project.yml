name: LockIn
options:
  bundleIdPrefix: com.lockin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  LockIn:
    type: application
    platform: macOS
    sources:
      - path: LockIn
        excludes:
          - "Resources/Info.plist"
          - "Resources/LockIn.entitlements"
    settings:
      base:
        PRODUCT_NAME: "Lock In"
        PRODUCT_BUNDLE_IDENTIFIER: com.lockin.LockIn
        INFOPLIST_FILE: LockIn/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LockIn/Resources/LockIn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
  LockInTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LockInTests
      - path: LockIn/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockin.LockInTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
        LockInTests: [test]
    test:
      targets:
        - LockInTests
